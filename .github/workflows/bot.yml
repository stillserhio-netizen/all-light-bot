name: Light Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Every 15 minutes during the daytime window,
    # then hourly overnight. UTC hours 3-20 correspond to roughly 06:00-23:59 Kyiv time in summer.
    - cron: "*/15 3-20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22-23 * * *"
    - cron: "0 0-2 * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch and publish schedules
        run: python bot.py
